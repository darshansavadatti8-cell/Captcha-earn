{% extends "base.html" %}{% block title %}Create account · CaptchaEarn{% endblock %}{% block content %}<div class="auth"><h1>Create your account</h1><p class="muted">Start with authorized transcription tasks.</p><form method="post">{{ form.hidden_tag() }}<label>{{ form.username.label }}{{ form.username() }}</label><label>{{ form.email.label }}{{ form.email(type="email") }}</label><label>{{ form.password.label }}{{ form.password() }}</label><label>{{ form.confirm.label }}{{ form.confirm() }}</label>{{ form.submit(class="button full") }}</form><p>Already registered? <a href="{{ url_for('login') }}">Login</a></p></div>{% endblock %}
